name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  deny:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  chart:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - run: helm lint charts/stalewise --set backend.service=catalog
      - run: helm lint charts/stalewise -f charts/stalewise/values-mesh.yaml
      - name: Numeric values render as integers, not scientific notation
        run: |
          if helm template t charts/stalewise --set backend.service=catalog | grep -nE '"[0-9.]+e\+[0-9]+"'; then exit 1; fi
      - name: Install kubeconform
        run: |
          go install github.com/yannh/kubeconform/cmd/kubeconform@v0.8.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: scripts/chart-check.sh

  workflows:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: actionlint
      - run: scripts/workflow-check.sh

  integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Build image
        run: docker build -t stalewise:it .
      - name: Real varnishd tests
        env:
          STALEWISE_IMAGE: stalewise:it
        run: cargo test --locked --test varnish -- --ignored --test-threads=1
