[package]
name = "stalewise"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license-file = "LICENSE"
description = "Supervises Varnish as a Kubernetes-aware HTTP cache"
repository = "https://github.com/jgautheron/stalewise"
publish = false

[dependencies]
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "process", "signal", "sync", "time", "fs", "io-util", "macros"] }
kube = { version = "5.0.0", default-features = false, features = ["client", "runtime", "rustls-tls", "ring"] }
k8s-openapi = { version = "0.29.0", features = ["v1_33"] }
hyper = { version = "1.12.0", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
http-body-util = "0.1.5"
bytes = "1.12.1"
minijinja = { version = "3.0.5", default-features = false, features = ["serde", "fuel", "builtins", "debug"] }
serde = { version = "1.0.229", features = ["derive"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
prometheus-client = "0.25.2"
sha2 = "0.11.1"
rand = "0.10.3"
thiserror = "2.0.21"
tokio-util = { version = "0.7.20", features = ["rt"] }
futures-util = "0.3.34"
libc = "0.2.191"
subtle = "2.6.1"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["test-util"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
