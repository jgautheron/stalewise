[package]
name = "stalewise"
version = "0.5.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "Supervises Varnish as a Kubernetes-aware HTTP cache"
repository = "https://github.com/jgautheron/stalewise"
publish = false

[dependencies]
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "process", "signal", "sync", "time", "fs", "io-util", "macros"] }
kube = { version = "5.0.0", default-features = false, features = ["client", "runtime", "derive", "rustls-tls", "ring"] }
k8s-openapi = { version = "0.29.0", features = ["v1_33", "schemars"] }
hyper = { version = "1.12.0", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
http-body-util = "0.1.5"
bytes = "1.12.1"
minijinja = { version = "3.1.0", default-features = false, features = ["serde", "fuel", "builtins"] }
serde = { version = "1.0.229", features = ["derive"] }
clap = { version = "4.6.7", default-features = false, features = ["std", "help", "usage", "error-context", "derive", "env"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["std", "fmt", "tracing-log"] }
prometheus-client = "0.25.2"
sha2 = { version = "0.11.1", default-features = false }
getrandom = { version = "0.4.3", default-features = false }
thiserror = "2.0.21"
tokio-util = { version = "0.7.20", features = ["rt"] }
futures-util = { version = "0.3.34", default-features = false, features = ["alloc"] }
libc = "0.2.191"
subtle = "2.6.1"
schemars = "1.2.3"
serde_json = "1.0.154"
serde_norway = "0.9.42"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["test-util"] }

[profile.release]
lto = "thin"
codegen-units = 1
