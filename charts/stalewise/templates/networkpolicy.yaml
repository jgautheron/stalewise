{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "stalewise.fullname" . }}
  labels:
    {{- include "stalewise.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "stalewise.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - port: http
          protocol: TCP
      {{- with .Values.networkPolicy.trafficFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- if .Values.networkPolicy.trafficFrom }}
    - ports:
        - port: http
          protocol: TCP
      from:
        - podSelector:
            matchLabels:
              {{- include "stalewise.selectorLabels" . | nindent 14 }}
    {{- end }}
    - ports:
        - port: management
          protocol: TCP
      {{- with .Values.networkPolicy.managementFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- if .Values.signaller.enabled }}
    - ports:
        - port: signaller
          protocol: TCP
      {{- with .Values.networkPolicy.signallerFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- end }}
{{- end }}
