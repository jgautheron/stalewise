{{- if .Values.mesh.peerAuthentication }}
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: {{ include "stalewise.fullname" . }}
  labels:
    {{- include "stalewise.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "stalewise.selectorLabels" . | nindent 6 }}
  mtls:
    mode: STRICT
{{- end }}
