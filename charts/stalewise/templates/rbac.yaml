apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "stalewise.fullname" . }}
  labels:
    {{- include "stalewise.labels" . | nindent 4 }}
rules:
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "stalewise.fullname" . }}
  labels:
    {{- include "stalewise.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "stalewise.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "stalewise.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
