# Mesh profile: one Service DNS origin balanced by the sidecar, peers purge via 127.0.0.6.
profile: mesh
# Names every resource catalog-cache, the Service host the VirtualService routes to.
fullnameOverride: catalog-cache
backend:
  watch: false
  host: catalog.apps.svc.cluster.local
  port: 8080
canonicalHost: catalog.apps.svc.cluster.local
signaller:
  enabled: true
  tokenSecret:
    name: catalog-cache-signaller
    key: token
mesh:
  sidecar: true
  authorizationPolicy: true
  # Four Envoy workers with a 4-core limit: +28% hit throughput, lower p99; reserves more CPU.
  proxy:
    concurrency: 4
    cpuRequest: 500m
    cpuLimit: "4"
podAnnotations:
  sidecar.istio.io/inject: "true"
  # Keeps the sidecar forwarding through drainDelay (10s) plus a margin.
  proxy.istio.io/config: '{"holdApplicationUntilProxyStarts": true, "terminationDrainDuration": "15s"}'
cachePolicies:
  enabled: true
  policies:
    - name: catalog
      spec:
        serviceRef:
          name: catalog
        pathPrefix: /
        overrides:
          graceSeconds: 30
        bypass:
          - pathPrefix: /account
        attach:
          mode: route
