# Image; set digest to pin an exact build.
image:
  repository: ghcr.io/jgautheron/stalewise
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

# Override the chart name in resource names, or the whole resource name prefix.
nameOverride: ""
fullnameOverride: ""

replicaCount: 2

# generic watches origin EndpointSlices; mesh uses one Service DNS origin.
profile: generic

backend:
  watch: true
  service: ""
  portName: http
  host: ""
  port: 8080
  probePath: /

# Host every request is normalised to; required for the mesh profile.
canonicalHost: ""
allowEmptyBackends: false

ports:
  http: 8080
  signaller: 8081
  management: 9090
  # Kubelet probes only, bound on the pod IP; not in any Service or NetworkPolicy rule.
  probe: 9091

storage: malloc,256m
# Uncacheable and short-lived objects; keep it finite so a slow client cannot exhaust memory.
transientStorage: malloc,64m
# Bytes an uncacheable fetch may read ahead of its client (Varnish transit_buffer).
# Each slow stream holds a few times this in Transient; 0 lets one slow client fill Transient and truncate.
transitBuffer: 1048576
maxVcls: 5
uncacheableTtl: 30s
maxObjectSize: 10485760
# Remove X-Forwarded-Host, X-Original-URL and X-Rewrite-URL from requests before hashing and fetching.
stripRewriteHeaders: true
varnishParams: []
logLevel: info

# Optional raw VCL template; trusted executable configuration.
template:
  existingConfigMap: ""
  key: template.vcl
  inline: ""
  pollInterval: 2s
  env: []

signaller:
  enabled: false
  # Secret holding the bearer token (32-256 visible bytes).
  tokenSecret:
    name: ""
    key: token
  methods: [PURGE, BAN]
  deliveryDeadline: 10s
  # Host header for peer deliveries and shard forwards; empty means the headless peers Service FQDN and port.
  peerAuthority: ""
  # Invalidation status records kept for GET /invalidations/<id>.
  invalidationHistory: 1024

# Route each object to one owner replica through the VCL shard director; opt-in.
shard:
  enabled: false
  # Freshness cap for copies non-owners keep, at most 30s; 0s stores no bodies off-owner.
  localTtl: 0s
  # How long a peer membership change must persist before the ring changes (100ms-30s).
  membershipDebounce: 5s
  # Connect, first-byte and between-bytes timeout for forwarded requests.
  peerTimeout: 2s

# CachePolicy resources (stalewise.dev/v1alpha1); incompatible with a raw template.
cachePolicies:
  enabled: false
  # Report route attachment on CachePolicy status; needs VirtualService read access.
  validateAttachment: true
  # CachePolicies rendered per cache; older policies win and the rest get reason TooManyPolicies.
  maxPolicies: 256
  # Service policies must reference; defaults to backend.service or the first backend.host label.
  service: ""
  # CachePolicies this release ships: [{name, spec}]; spec follows the CRD.
  policies: []

# Extra purge ACL entries beyond loopback and the signaller defaults.
purgeAcl: []

mesh:
  # The pod runs an Istio-style sidecar that delivers inbound traffic from 127.0.0.6.
  sidecar: false
  # Deny PURGE/BAN at the sidecar unless the caller is this cache's service account.
  # Required with sidecar and signaller: the chart refuses to render without it.
  authorizationPolicy: false
  # Render a STRICT mTLS PeerAuthentication for the cache pods.
  peerAuthentication: false
  trustDomain: cluster.local

serviceAccount:
  create: true
  name: ""
  annotations: {}

podAnnotations: {}
podLabels: {}
# The memory limit budgets storage (256m) + transientStorage (64m) + ~190Mi process overhead.
resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    memory: 512Mi
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
# Seconds stalewise keeps serving after SIGTERM while /readyz reports draining; 0 disables.
# No preStop hook: the in-process delay flips readiness at once and is the single timing source.
drainDelay: 10
# Seconds for the whole shutdown, drain included; must exceed drainDelay.
shutdownTimeout: 30
# Lower bound; the chart renders at least drainDelay + shutdownTimeout + 5.
terminationGracePeriodSeconds: 45

service:
  type: ClusterIP
  annotations: {}

podDisruptionBudget:
  enabled: true
  maxUnavailable: 1

networkPolicy:
  enabled: false
  # NetworkPolicyPeer lists; an empty list admits no source on that port.
  # Cache pods always reach each other's http port; kubelet probes need no rule.
  trafficFrom: []
  managementFrom: []
  signallerFrom: []

# Sidecars such as a Varnish exporter; mount the "varnish" volume read-only for VSM.
extraContainers: []
extraArgs: []
