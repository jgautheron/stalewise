# Image; set digest to pin an exact build.
image:
  repository: ghcr.io/jgautheron/stalewise
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

# Override the chart name in resource names, or the whole resource name prefix.
nameOverride: ""
fullnameOverride: ""

replicaCount: 2

# generic watches origin EndpointSlices; mesh uses one Service DNS origin.
profile: generic

backend:
  watch: true
  service: ""
  portName: http
  host: ""
  port: 8080
  probePath: /

# Host every request is normalised to; required for the mesh profile.
canonicalHost: ""
allowEmptyBackends: false

ports:
  http: 8080
  signaller: 8081
  management: 9090

storage: malloc,256m
maxVcls: 5
uncacheableTtl: 30s
maxObjectSize: 10485760
varnishParams: []
logLevel: info

# Optional raw VCL template; trusted executable configuration.
template:
  existingConfigMap: ""
  key: template.vcl
  inline: ""
  pollInterval: 2s
  env: []

signaller:
  enabled: false
  # Secret holding the bearer token (32-256 visible bytes).
  tokenSecret:
    name: ""
    key: token
  methods: [PURGE, BAN]
  deliveryDeadline: 10s
  # Host header for peer deliveries and shard forwards; empty means the headless peers Service FQDN and port.
  peerAuthority: ""
  # Invalidation status records kept for GET /invalidations/<id>.
  invalidationHistory: 1024

# Route each object to one owner replica through the VCL shard director; opt-in.
shard:
  enabled: false
  # Freshness cap for copies non-owners keep, at most 30s; 0s stores no bodies off-owner.
  localTtl: 0s
  # How long a peer membership change must persist before the ring changes (100ms-30s).
  membershipDebounce: 5s
  # Connect, first-byte and between-bytes timeout for forwarded requests.
  peerTimeout: 2s

# CachePolicy resources (stalewise.dev/v1alpha1); incompatible with a raw template.
cachePolicies:
  enabled: false
  # Report route attachment on CachePolicy status; needs VirtualService read access.
  validateAttachment: true
  # Service policies must reference; defaults to backend.service or the first backend.host label.
  service: ""
  # CachePolicies this release ships: [{name, spec}]; spec follows the CRD.
  policies: []

# Extra purge ACL entries beyond loopback and the signaller defaults.
purgeAcl: []

mesh:
  # The pod runs an Istio-style sidecar that delivers inbound traffic from 127.0.0.6.
  sidecar: false
  # Deny PURGE/BAN at the sidecar unless the caller is this cache's service account.
  # Required with sidecar and signaller: the chart refuses to render without it.
  authorizationPolicy: false
  # Render a STRICT mTLS PeerAuthentication for the cache pods.
  peerAuthentication: false
  trustDomain: cluster.local

serviceAccount:
  create: true
  name: ""
  annotations: {}

podAnnotations: {}
podLabels: {}
resources: {}
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
terminationGracePeriodSeconds: 40

service:
  type: ClusterIP
  annotations: {}

podDisruptionBudget:
  enabled: true
  maxUnavailable: 1

networkPolicy:
  enabled: false
  # NetworkPolicyPeer lists; empty means any source in the namespace's cluster.
  trafficFrom: []
  managementFrom: []
  signallerFrom: []

# Sidecars such as a Varnish exporter; mount the "varnish" volume read-only for VSM.
extraContainers: []
extraArgs: []
